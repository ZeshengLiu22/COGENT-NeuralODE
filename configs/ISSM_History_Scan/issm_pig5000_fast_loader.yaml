# ISSM PIG-5000 data path plus measured dataloader settings for formal runs.
# Measured from the PIG_5000 dataloader speed sweep:
#   issm_node2_h4_up1_dataloader_20260531_004259
dataset:
  data_dir: ./data/ISSM/PIG_5000
  num_workers: 4
  val_num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
