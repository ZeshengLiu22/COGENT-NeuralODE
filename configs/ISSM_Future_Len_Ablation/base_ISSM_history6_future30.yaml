seed: 42
deterministic: false
output_dir: outputs

dataset:
  name: issm
  data_dir: ./data/ISSM/PIG_data
  file_patterns:
    - "*.mat"
    - "*.npz"
    - "*.pt"
    - "*.pth"
  history_len: 6
  future_len: 30
  stride: 1
  num_workers: 4
  cache_in_memory: true
  split:
    strategy: issm_rate_modulo
    modulo: 20
    val_remainder: 0
    test_remainder: 10
  sampled_windows:
    windows_per_scenario: null
    epoch_num_windows: null

normalization:
  std_floor: 1.0e-5

model:
  name: node1
  latent_dim: 64
  dropout: 0.0
  decoder_hidden_dims: [64, 64]
  decoder_activation: gelu
  history_encoder:
    static_hidden_dims: [96, 96]
    static_embed_dim: 96
    gnn_hidden_dim: 96
    gnn_num_layers: 2
    gnn_type: sage
    gnn_activation: gelu
    lstm_hidden_dim: 96
    lstm_num_layers: 1
    history_encoder_type: transformer
    use_transformer_history: true
    history_transformer_num_layers: 2
    history_transformer_num_heads: 4
    history_transformer_ff_dim: 384
    history_transformer_dropout: 0.05
    history_use_positional_encoding: true
    history_context_pooling: last
    dropout: 0.05
  continuous:
    hidden_dim: 96
    num_layers: 2
    gnn_type: sage
    activation: softplus
    dropout: 0.0

solver:
  ode_method: midpoint
  cde_method: rk4
  interpolation: hermite_cubic_backward #linear
  rtol: 1.0e-4
  atol: 1.0e-5
  use_adjoint: false
  ode_options: null
  cde_options: null

training:
  epochs: 300
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-5
  scheduler: cosine
  min_lr: 0.0
  grad_accum_steps: 1
  max_grad_norm: 1.0
  grad_clip_norm_dtype: fp32
  scale_factor: 100.0
  train_horizon_mode: biased_long_horizon
  train_horizon_min: 24
  train_horizon_max: null
  train_horizon_curriculum:
    enabled: true
    epochs: 120
    warmup_fractions: [0.40, 0.55, 0.70, 0.85]
  log_every: 1
  val_every: 1

evaluation:
  batch_size: 1
  checkpoint_metric: whole_rollout_rmse
  full_rollout_on_val: true
  full_rollout_known_steps: 60 #null

distributed:
  backend: nccl
  find_unused_parameters: false

amp:
  mode: bf16
