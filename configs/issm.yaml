dataset:
  name: issm
  data_dir: ./data/ISSM/PIG_data
  file_patterns:
    - "*.mat"
    - "*.npz"
    - "*.pt"
    - "*.pth"
  split:
    strategy: issm_rate_modulo
    modulo: 20
    val_remainder: 0
    test_remainder: 10
  issm: {}

# Random Split:
# dataset:
#   split:
#     strategy: random
#     train: 0.7
#     val: 0.15
#     test: 0.15
#     seed: 42

# Verified 240 snapshots minus 60 known steps.
model:
  relative_time_scale: 180.0

evaluation:
  amp_mode: none
  checkpoint_metric: whole_rollout_norm_rmse
  full_rollout_known_steps: 60
