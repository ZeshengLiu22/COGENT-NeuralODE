model:
  node2_vector_field_type: structured_v2
  structured_dynamics:
    # 2026-05-26 follow-up from the best 0524 setting.
    # Test whether RMSNorm + direct gates still works when coupling is removed.
    use_f_local: true
    use_f_spatial: true
    use_f_forcing: true
    use_f_coupling: false

    # Normalize each active derivative branch over latent channels before fusion.
    term_norm: rmsnorm

    # direct_gated learns one scalar gate per active branch. With gate_init:
    # active_mean and three active terms, gates start at 1/3 each.
    fusion: direct_gated
    gate_init: active_mean
