model:
  node2_vector_field_type: structured_v2
  structured_dynamics:
    # 2026-05-24 four-term structured-v2 stability scan.
    # All four branches are active; coupling-off will be tested later.
    use_f_local: true
    use_f_spatial: true
    use_f_forcing: true
    use_f_coupling: true

    # Normalize each active derivative branch over latent channels before fusion.
    # Options: none, layernorm, rmsnorm.
    term_norm: layernorm

    # softmax_gated learns one scalar logit per branch. With zero initial logits
    # and four active terms, active weights start at 0.25 each.
    fusion: softmax_gated
    gate_init: active_mean
