# Best setting from the PIG_5000 3-epoch dataloader speed sweep
# run: issm_node2_h4_up1_dataloader_20260531_004259
#
# Merge this after configs/issm.yaml and model configs if you want to reuse the
# measured fast dataloader path for ISSM PIG-5000 runs.
#
# Stable copy for formal scripts:
# configs/ISSM_History_Scan/issm_pig5000_fast_loader.yaml
dataset:
  data_dir: ./data/ISSM/PIG_5000
  num_workers: 4
  val_num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
