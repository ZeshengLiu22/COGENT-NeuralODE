# Short smoke override for the real scripts/train.py path.
# Keeps formal full-rollout validation on, uses PIG-5000 via the fast-loader
# config, and caps the sampled training horizon only to avoid the known
# non-finite-gradient failure at k_eff=110 in this checkout.
output_dir: experiments/dataloader_speed_sweep/formal_smoke_outputs

training:
  epochs: 1
  train_horizon_max: 60
  val_every: 1

evaluation:
  full_rollout_on_val: true
  checkpoint_metric: whole_rollout_rmse
